<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TapVerse Mining</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: radial-gradient(circle at top, #1e1b4b, #09090b); color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); }
    .user-info { font-weight: 700; font-size: 16px; color: #a5b4fc; }
    .level-badge { background: linear-gradient(90deg, #f59e0b, #d97706); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .score-section { text-align: center; margin-top: 15px; }
    .score-label { font-size: 13px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }
    .score { font-size: 44px; font-weight: 900; color: #fbbf24; text-shadow: 0 0 20px rgba(251,191,36,0.4); margin-top: 5px; }
    .page { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
    .page.active { display: flex; }
    .coin-btn { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fde047, #eab308, #a16207); border: 8px solid #fef08a; box-shadow: 0 0 40px rgba(234,179,8,0.5), inset 0 0 25px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-size: 80px; cursor: pointer; transition: transform 0.08s ease; position: relative; }
    .coin-btn:active { transform: scale(0.93); }
    .floating-num { position: absolute; font-size: 28px; font-weight: 900; color: #fff; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-90px) scale(1.2); } }
    .energy-box { width: 100%; max-width: 340px; margin-top: 25px; }
    .energy-info { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; font-weight: 600; color: #e2e8f0; }
    .bar-bg { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); width: 100%; transition: width 0.2s; }
    .card { width: 100%; max-width: 360px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .card-sub { font-size: 12px; color: #9ca3af; }
    .btn { background: linear-gradient(90deg, #f59e0b, #ea580c); border: none; color: #fff; padding: 9px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; }
    .btn-ad { background: linear-gradient(90deg, #10b981, #059669); }
    .nav { display: flex; justify-content: space-around; background: rgba(15,23,42,0.95); padding: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
    .nav-btn { background: none; border: none; color: #64748b; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; }
    .nav-btn.active { color: #fbbf24; }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-info" id="username">⛏️ Miner</div>
    <div class="level-badge" id="level-text">Level 1</div>
  </div>

  <div class="score-section">
    <div class="score-label">Total Balance</div>
    <div class="score" id="score">0</div>
  </div>

  <div class="page active" id="mine-page">
    <div class="coin-btn" id="coin-btn">🪙</div>
    <div class="energy-box">
      <div class="energy-info">
        <span>⚡ Energy</span>
        <span id="energy-text">500 / 500</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="energy-bar"></div></div>
    </div>
  </div>

  <div class="page" id="boost-page">
    <div class="card">
      <div>
        <div class="card-title">📺 Watch Ad (+1,000 Coins)</div>
        <div class="card-sub">Instant Free Reward</div>
      </div>
      <button class="btn btn-ad" onclick="watchAdReward()">Watch</button>
    </div>
    <div class="card">
      <div>
        <div class="card-title">👆 Multitap Upgrade</div>
        <div class="card-sub" id="tap-cost-text">+1 coin per tap (Cost: 100)</div>
      </div>
      <button class="btn" onclick="upgradeTap()">Buy</button>
    </div>
    <div class="card">
      <div>
        <div class="card-title">🔋 Energy Limit</div>
        <div class="card-sub" id="energy-cost-text">+250 max energy (Cost: 150)</div>
      </div>
      <button class="btn" onclick="upgradeEnergy()">Buy</button>
    </div>
  </div>

  <div class="page" id="friends-page">
    <div class="card" style="flex-direction: column; text-align: center; gap: 12px; padding: 22px;">
      <div class="card-title" style="font-size: 18px;">🎁 Invite Friends & Earn</div>
      <div class="card-sub">Share your bot link with friends and get +2,500 bonus coins!</div>
      <button class="btn" style="width: 100%; padding: 12px;" onclick="shareBot()">Share Invite Link</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="switchTab('mine-page', this)">⛏️<span>Mine</span></button>
    <button class="nav-btn" onclick="switchTab('boost-page', this)">🚀<span>Boost & Ads</span></button>
    <button class="nav-btn" onclick="switchTab('friends-page', this)">👥<span>Friends</span></button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.initDataUnsafe?.user?.first_name) {
      document.getElementById('username').innerText = '⛏️ ' + tg.initDataUnsafe.user.first_name;
    }

    let score = parseInt(localStorage.getItem('tv_score')) || 0;
    let tapPower = parseInt(localStorage.getItem('tv_tap')) || 1;
    let maxEnergy = parseInt(localStorage.getItem('tv_maxE')) || 500;
    let energy = parseInt(localStorage.getItem('tv_energy')) || 500;

    function saveState() {
      localStorage.setItem('tv_score', score);
      localStorage.setItem('tv_tap', tapPower);
      localStorage.setItem('tv_maxE', maxEnergy);
      localStorage.setItem('tv_energy', energy);
      updateUI();
    }

    function updateUI() {
      document.getElementById('score').innerText = score.toLocaleString();
      document.getElementById('energy-text').innerText = `${energy} / ${maxEnergy}`;
      document.getElementById('energy-bar').style.width = `${(energy / maxEnergy) * 100}%`;
      document.getElementById('level-text').innerText = `Level ${tapPower}`;
      document.getElementById('tap-cost-text').innerText = `+1 coin per tap (Cost: ${tapPower * 100})`;
      document.getElementById('energy-cost-text').innerText = `+250 max energy (Cost: ${(maxEnergy / 250) * 100})`;
    }

    document.getElementById('coin-btn').addEventListener('pointerdown', (e) => {
      if (energy >= tapPower) {
        score += tapPower;
        energy -= tapPower;
        saveState();

        const num = document.createElement('div');
        num.className = 'floating-num';
        num.innerText = `+${tapPower}`;
        num.style.left = `${e.offsetX}px`;
        num.style.top = `${e.offsetY}px`;
        e.currentTarget.appendChild(num);
        setTimeout(() => num.remove(), 800);
      }
    });

    setInterval(() => {
      if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + 2);
        saveState();
      }
    }, 1000);

    function upgradeTap() {
      const cost = tapPower * 100;
      if (score >= cost) { score -= cost; tapPower++; saveState(); }
      else { alert('Not enough coins!'); }
    }

    function upgradeEnergy() {
      const cost = (maxEnergy / 250) * 100;
      if (score >= cost) { score -= cost; maxEnergy += 250; energy = maxEnergy; saveState(); }
      else { alert('Not enough coins!'); }
    }

    function watchAdReward() {
      alert('Ad finished! You earned +1,000 Coins!');
      score += 1000;
      saveState();
    }

    function shareBot() {
      const botUrl = "https://t.me/TapVerse_Mining_Bot";
      tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent("🔥 Join TapVerse Mining and earn coins daily!")}`);
    }

    function switchTab(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      btn.classList.add('active');
    }

    updateUI();
  </script>
</body>
  </html>
